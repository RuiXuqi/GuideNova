apply from: 'gradle/scripts/helpers.gradle'

repositories {
    flatDir {
        dirs('libs') // /libs
    }
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

configurations {
    localImplementation
    shaded {
        transitive = false
    }
    // Dependencies only used for the guide export, but not shipped
    guideExportOnly
    configurations.compileClasspath.extendsFrom(guideExportOnly)
    configurations.runtimeClasspath.extendsFrom(guideExportOnly)

    compileClasspath.extendsFrom localImplementation
    runtimeClasspath.extendsFrom localImplementation
    testCompileClasspath.extendsFrom localImplementation
    testRuntimeClasspath.extendsFrom localImplementation
}

dependencies {
    compileOnly "com.cleanroommc:sponge-mixin:0.20.13+mixin.0.8.7"
    if (propertyBool('enable_lwjglx')) {
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }

    // Example - Dependency descriptor:
    // 'com.google.code.gson:gson:2.8.6' << group: com.google.code.gson, name:gson, version:2.8.6
    // 'group:name:version:classifier' where classifier is optional

    // Example - Shading dependencies:
    // Using the shadow plugin, by using the "shaded" configuration, the dependency will be shaded into your output jar
    // shaded 'mezz:jei:4.31.2' << will shade HadEnoughItems 4.31.2 directly into your jar
    // For more configuration options: see the bottom of this file and: https://gradleup.com/shadow/configuration/

    // Example - CurseMaven dependencies:
    // 'curse.maven:had-enough-items-557549:4543375' << had-enough-items = project slug, 557549 = project id, 4543375 = file id
    // Full documentation: https://cursemaven.com/

    // Example - Modrinth dependencies:
    // 'maven.modrinth:jei:4.16.1.1000' << jei = project name, 4.16.1.1000 = file version
    // Full documentation: https://docs.modrinth.com/docs/tutorials/maven/

    // Example - Local dependencies:
    // 'libs:ctm-1.2.1; << libs = folder name (/libs) in flatDir, ctm-1.2.1 = file name (ctm-1.2.1.jar)

    // Common dependency types (configuration):
    // implementation = dependency available at both compile time and runtime
    // runtimeOnly = runtime dependency
    // compileOnly = compile time dependency
    // annotationProcessor = annotation processing dependencies
    // contain = bundle dependency jars into final artifact, will extract them in mod loading. Can be used it as jar-in-jar
    // shaded = bundle dependencies into shadow output artifact (relocation configurable in shadowJar task)
    // modImplementation = mod dependency available at both compile time and runtime
    // modCompileOnly = mod dependency available only at compile time

    // Transitive dependencies:
    // (Dependencies that your dependency depends on)
    // If you wish to exclude transitive dependencies in the described dependencies
    // Use a closure as such:
    // implementation ('com.google.code.gson:gson:2.8.6') {
    //     transitive = false
    // }

    compileOnly "org.jetbrains:annotations:26.1.0"

    // To be copied into the jar file
    shaded project(path: ':markdown', configuration: "runtimeElements")
    shaded "io.methvin:directory-watcher:${directory_watcher_version}"
    shaded "org.yaml:snakeyaml:${snakeyaml_version}"
    shaded "com.google.flatbuffers:flatbuffers-java:${flatbuffers_version}"

    localImplementation(project(':markdown')) {
        transitive = false
    }
    // Do not inherit any transitive dependencies here since we rely on those transitive dependencies being
    // present in Minecrafts own dependencies already.
    localImplementation("io.methvin:directory-watcher:${directory_watcher_version}") {
        transitive = false
    }
    localImplementation("org.yaml:snakeyaml:${snakeyaml_version}") {
        transitive = false
    }
    localImplementation("com.google.flatbuffers:flatbuffers-java:${flatbuffers_version}") {
        transitive = false
    }
    shaded(localImplementation("org.apache.lucene:lucene-core:${lucene_version}"))
    shaded(localImplementation("org.apache.lucene:lucene-analysis-common:${lucene_version}"))
    shaded(localImplementation("org.apache.lucene:lucene-queryparser:${lucene_version}"))
    shaded(localImplementation("org.apache.lucene:lucene-facet:${lucene_version}"))
    shaded(localImplementation("org.apache.lucene:lucene-queries:${lucene_version}"))
    shaded(localImplementation("org.apache.lucene:lucene-highlighter:${lucene_version}"))
    shaded(localImplementation("org.apache.lucene:lucene-memory:${lucene_version}"))

    // Used for the guide export
    guideExportOnly("org.bytedeco:ffmpeg-platform:${ffmpeg_version}")

    // unit test dependencies
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation(platform("org.assertj:assertj-bom:${assertj_version}"))
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.junit.jupiter:junit-jupiter-params")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testImplementation("org.junit.platform:junit-platform-launcher")
    testImplementation("org.assertj:assertj-core")
    testImplementation("org.mockito:mockito-junit-jupiter:5.21.0")
}

shadow {
    addShadowVariantIntoJavaComponent = false
}

tasks.named("shadowJar").configure {
    from sourceSets.main.output.classesDirs
    from sourceSets.main.output.resourcesDir
    exclude '.cache/**'

    dependencies {
        exclude 'META-INF/maven/**'
    }
    mergeServiceFiles()

    relocate "io.methvin", "guideme.internal.shaded.methvin"
    relocate "org.yaml.snakeyaml", "guideme.internal.shaded.snakeyaml"
    relocate "com.google.flatbuffers", "guideme.internal.shaded.flatbuffers"
    relocate "org.apache.lucene", "guideme.internal.shaded.lucene"
    relocate "org.tartarus.snowball", "guideme.internal.shaded.snowball"
}
